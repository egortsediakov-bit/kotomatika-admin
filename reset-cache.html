<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>КОТОМАТИКА — обновление</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f7f6f2;margin:0;min-height:100vh;display:grid;place-items:center}
    .card{width:min(420px,calc(100% - 40px));background:#fff;border:1px solid #e7e3dc;border-radius:24px;padding:28px;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.08)}
    .logo{width:52px;height:52px;border-radius:16px;background:#ff5a12;color:#fff;display:grid;place-items:center;margin:0 auto 16px;font-weight:900;font-size:22px}
    h1{font-size:24px;margin:0 0 8px}p{color:#777;line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">К</div>
    <h1>Обновляю админку…</h1>
    <p id="msg">Очищаю старый кэш и устанавливаю новую версию с календарём.</p>
  </div>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
        localStorage.removeItem('kotomatika-admin-cache');
        sessionStorage.clear();
        document.getElementById('msg').textContent='Готово. Открываю новую версию…';
        setTimeout(()=>location.replace('./?v=8&fresh='+Date.now()),700);
      }catch(e){
        document.getElementById('msg').textContent='Кэш очищен частично. Открываю новую версию…';
        setTimeout(()=>location.replace('./?v=8&fresh='+Date.now()),900);
      }
    })();
  </script>
</body>
</html>
