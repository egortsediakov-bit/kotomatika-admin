<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КОТОМАТИКА CRM — обновление</title><style>body{font-family:Arial,sans-serif;background:#f7f6f2;margin:0;min-height:100vh;display:grid;place-items:center}.c{width:min(420px,calc(100% - 40px));background:#fff;border:1px solid #e7e3dc;border-radius:24px;padding:28px;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.08)}.l{width:52px;height:52px;border-radius:16px;background:#ff5a12;color:#fff;display:grid;place-items:center;margin:0 auto 16px;font-weight:900;font-size:22px}p{color:#777;line-height:1.5}</style></head><body><div class="c"><div class="l">К</div><h2>Обновляю CRM…</h2><p id="m">Очищаю старый кэш.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}sessionStorage.removeItem('kotomatika_crm_session_v1');document.getElementById('m').textContent='Готово. Открываю новую версию…';setTimeout(()=>location.replace('./?v=master17&fresh='+Date.now()),700)}catch(e){setTimeout(()=>location.replace('./?v=master17&fresh='+Date.now()),900)}})()</script></body></html>
